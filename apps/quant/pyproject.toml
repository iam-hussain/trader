[project]
name = "trader-quant"
version = "0.1.0"
description = "Python quant + scraping service for Trader Daily"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "yfinance>=0.2.44",
  "pandas>=2.2",
  "numpy>=2.0",
  "pandas-ta-classic>=0.3.14b0",
  "lxml>=5.3",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "duckdb>=1.1",
  "pyarrow>=17.0",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
  "tenacity>=9.0"
]

[project.optional-dependencies]
heavy = [
  "prophet>=1.1.6",
  "vectorbt>=0.26",
  "statsmodels>=0.14",
  "transformers>=4.45",
  "torch>=2.4",
  "playwright>=1.48"
]

[tool.uv]
package = false
